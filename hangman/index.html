<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Hangman</h1>
    <div id="hangman"></div>
    <div id="word"></div>
    <div id="message"></div>
    <input type="text" id="guessInput" maxlength="1" placeholder="Guess a letter">
    <button id="guessButton">Guess</button>
    <div id="lives">Lives: 5</div>
  </div>
  <script src="hang.js"></script>
</body>
</html>
