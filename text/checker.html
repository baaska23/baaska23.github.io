<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Difference Checker</title>
    <link rel="stylesheet" href="checker.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .editable {
            width: 100%;
            height: 450px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #fff;
            overflow-y: auto;
        }
        .editable[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: #aaa;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #00c281;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #00a76f;
        }
        #differenceOutput {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Difference Checker</h1>
        <div style="display: flex; gap: 10px;">
            <div id="first" class="editable" contenteditable="true" placeholder="Original text"></div>
            <div id="second" class="editable" contenteditable="true" placeholder="Changed text"></div>
        </div>
        <div style="display: flex; gap: 20px;">
            <button id="checkDifference">Find Difference</button>
            <button id="restart">Restart</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/diff@5.0.0/dist/diff.min.js"></script>    
    <script src="checker.js"></script>
</body>
</html>
